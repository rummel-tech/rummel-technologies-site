name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve S3 bucket and CloudFront distribution
        id: vars
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "S3_BUCKET=rummel-technologies-site-${ACCOUNT_ID}" >> $GITHUB_OUTPUT

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='Rummel Technologies Website'].Id" \
            --output text 2>/dev/null || echo "")
          echo "CLOUDFRONT_DIST_ID=${DIST_ID}" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: |
          # Hashed assets — long-lived cache (Vite fingerprints these)
          aws s3 sync website/dist "s3://${{ steps.vars.outputs.S3_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --exclude "*.json" \
            --cache-control "max-age=31536000,public,immutable"

          # index.html — never cache
          aws s3 cp website/dist/index.html \
            "s3://${{ steps.vars.outputs.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

          # JSON content files — never cache (updated by dashboard)
          find website/dist -name "*.json" | while read f; do
            key="${f#website/dist/}"
            aws s3 cp "$f" "s3://${{ steps.vars.outputs.S3_BUCKET }}/${key}" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/json"
          done

      - name: Invalidate CloudFront cache
        if: steps.vars.outputs.CLOUDFRONT_DIST_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.vars.outputs.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Website deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket:** ${{ steps.vars.outputs.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.vars.outputs.CLOUDFRONT_DIST_ID }}" ]; then
            echo "**CloudFront:** ${{ steps.vars.outputs.CLOUDFRONT_DIST_ID }} — cache invalidated" >> $GITHUB_STEP_SUMMARY
          else
            echo "**CloudFront:** not found — skipped invalidation" >> $GITHUB_STEP_SUMMARY
          fi
